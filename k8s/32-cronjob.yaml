# Scheduled one-time runs (here every 6 hours). Same pod spec as 31-job.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: starrocks-cluster-sync
  namespace: sync
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: starrocks-cluster-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: starrocks-cluster-sync:2.0
              imagePullPolicy: IfNotPresent
              env:
                - name: ONE_TIME_RUN_MODE
                  value: "true"
                - name: JAVA_TOOL_OPTIONS
                  value: "-Xmx512m"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1
                  memory: 1Gi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /secrets
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: starrocks-cluster-sync-config
            - name: credentials
              secret:
                secretName: starrocks-cluster-sync-credentials
                optional: true
